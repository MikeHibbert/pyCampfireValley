version: 1
campfire: Legal Team
steps:
- camper: Contract Researcher
  task: 'Read the agreement text, extract the key commercial and legal clauses, and
    summarize the core facts, obligations, and any sections that appear truncated
    or need manual confirmation. At minimum cover: parties, scope, payment, confidentiality,
    IP, IR35/independent contractor terms, substitution, working arrangements, and
    termination.'
  camper_id: 7a8f369aa1b74ea784ca746bd2e20143
- camper: Contract Analyst
  task: Using the agreement text and previous findings, identify the main legal and
    commercial risks, points that favor one party, and items worth renegotiating or
    validating manually. Focus on the most important practical issues rather than
    every possible observation.
  camper_id: fd68b22beb7b4896b7e2e030cda2fe94
- camper: Legal Reporter
  task: 'Prepare the final client-facing review. Explain the key findings, major risks,
    and practical next steps without exposing internal orchestration details. Use
    these exact section headings: Executive Summary, Key Clauses, Main Risks, Recommended
    Next Steps, Role Contributions. In Role Contributions, connect each prior specialist
    contribution to the final recommendations.'
  camper_id: 9c180fa41df64e22ae5146d8f58b77b8
